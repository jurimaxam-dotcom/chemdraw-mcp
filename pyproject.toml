[project]
name = "chempane"
version = "0.11.3"
description = "Chemistry panel for Claude Desktop (MCP server): ask for a molecule, get a drawing you can turn, click and export. Structures, 3D models, mechanisms and Anki cards drawn locally with RDKit, plus spectra and lab plots; proteins from the PDB or AlphaFold. Unofficial, not affiliated with Revvity."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES"]
authors = [{ name = "jurimaxam-dotcom" }]
keywords = ["mcp", "chemistry", "rdkit", "smiles", "structure-drawing", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.11"
dependencies = [
    "rdkit",
    "lxml",
    "requests",
    "mcp>=2.3,<3",
    "Pillow",
    "matplotlib>=3.10.9",
    "py2opsin>=1.2.0",
    "genanki>=0.13.1",
    "molmass>=2026.1.8",
]

[project.urls]
Documentation = "https://github.com/jurimaxam-dotcom/chemdraw-mcp/tree/main/docs"
Changelog = "https://github.com/jurimaxam-dotcom/chemdraw-mcp/blob/main/CHANGELOG.md"
Repository = "https://github.com/jurimaxam-dotcom/chemdraw-mcp"
Issues = "https://github.com/jurimaxam-dotcom/chemdraw-mcp/issues"

[project.scripts]
chempane = "chempane.server:main"
chempane-install = "chempane.desktop_config:main"
chempane-doctor = "chempane.doctor:main"
# Alte Befehle (bis 1.0): bestehende Claude-Desktop-Configs, install.sh-Klone und
# Anleitungen zeigen auf diese Namen. Die Hülle chemdraw-mcp (huelle/) liefert
# dieselben vier für uv-tool-Installationen, die unter dem alten Namen laufen.
chemdraw-mcp = "chempane.server:main"
chemdraw-tool-server = "chempane.server:main"
chemdraw-doctor = "chempane.doctor:main"
chemdraw-install = "chempane.desktop_config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Das Python-Paket benötigt nur das gebaute Panel.
exclude = ["chempane/ui/*", "!chempane/ui/dist"]

[tool.hatch.build.targets.wheel]
packages = ["chempane"]

[tool.hatch.build.targets.sdist]
# Erlaubnisliste statt Sperrliste: das sdist ist öffentlich, und hatchling packt sonst
# alles ein, was nicht gitignored ist — auch ungetrackte interne Dateien (Audit 20.10.2026).
only-include = ["chempane", "README.md", "LICENSE", "NOTICE", "THIRD_PARTY_LICENSES", "CHANGELOG.md"]

[tool.pytest.ini_options]
# "scripts" mit drin, damit dortige test_*.py automatisch vom Gate erfasst werden;
# die gen_*-Helfer selbst bleiben unberührt.
testpaths = ["tests", "scripts"]
markers = [
    "echtes_nci_get: Test prüft resolver._nci_get selbst (keine Umleitung auf requests.get)",
]

[dependency-groups]
dev = [
    # EXAKT dieselbe Version wie chempane/ui/package.json — nicht lockern.
    # Beide Playwright-Pakete (Python + JS) benutzen denselben Browser-Cache
    # (~/Library/Caches/ms-playwright) und laden je Version eine ANDERE
    # Build-Revision (z.B. chromium_headless_shell-1223 vs. -1228). Driftete das
    # ">=" auf eine neuere Version, lagen zwei Builds im Cache und der e2e-Test
    # startete gegen einen, den `npx playwright install` nie geholt hatte —
    # Gate falsch-rot mit Playwright-Stacktrace (Vorfall 14.08.2026).
    # Der Python-Playwright wird ausschließlich vom Hilfsskript
    # tests/screenshot_ui.py benutzt (kein Test, nicht im Gate); ihn ganz zu
    # entfernen wäre die Alternative — dafür müsste screenshot_ui.py aber sauber
    # degradieren, und ein Pin kostet nichts. Version hier ändern ⇒ package.json
    # mitziehen. Gleiche Nummer heißt nicht gleicher Build: bei 1.65.1 lud npm
    # Chromium 1255, PyPI 1254, und 1.65.2 gibt es nur auf PyPI (21.11.2026) —
    # nach dem Heben die Revision in beiden browsers.json vergleichen.
    "playwright==1.65.0",
    "pytest",
    "ruff>=0.15.16",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Sanfter Start: Pyflakes (F) + pycodestyle (E) + Import-Sortierung (I).
# Aggressive Auto-Fixes (z.B. unused-import-Entfernung) bewusst NICHT automatisch,
# weil RDKit-Imports teils nur wegen Seiteneffekten existieren.
select = ["E", "F", "I"]
ignore = ["E501"]  # Zeilenlänge nicht erzwingen
