[project]
name = "chemdraw-mcp"
version = "0.3.0"
description = "MCP server that turns molecule names or SMILES into publication-style 2D structure drawings (PNG/SVG via RDKit) — reaction schemes, mechanisms, spectra. Unofficial, not affiliated with Revvity."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "jurimaxam-dotcom" }]
keywords = ["mcp", "chemistry", "rdkit", "smiles", "structure-drawing", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.11"
dependencies = [
    "rdkit",
    "lxml",
    "requests",
    "mcp",
    "Pillow",
    "matplotlib>=3.10.9",
    "py2opsin>=1.2.0",
    "genanki>=0.13.1",
    "molmass>=2026.1.8",
]

[project.urls]
Repository = "https://github.com/jurimaxam-dotcom/chemdraw-mcp"
Issues = "https://github.com/jurimaxam-dotcom/chemdraw-mcp/issues"

[project.scripts]
chemdraw-mcp = "chemdraw_tool.server:main"
# Alias: existing Claude Desktop configs from install.sh point at this name.
chemdraw-tool-server = "chemdraw_tool.server:main"
# Installations-Diagnose: macht die stillen Ausfälle sichtbar, bevor sie im
# Chat als "der Server tut nichts" ankommen.
chemdraw-doctor = "chemdraw_tool.doctor:main"
# Eintragen in Claude Desktop ohne Repo-Clone — der Weg, den PyPI-/Registry-
# Nutzer gehen (install.sh gibt es dort nicht).
chemdraw-install = "chemdraw_tool.desktop_config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chemdraw_tool"]
# The built UI (MCP App resource) ships; the frontend toolchain does not.
exclude = [
    "chemdraw_tool/ui/node_modules",
    "chemdraw_tool/ui/src",
    "chemdraw_tool/ui/*.json",
    "chemdraw_tool/ui/*.html",
    "chemdraw_tool/ui/*.mjs",
    "chemdraw_tool/ui/vite.config.js",
    "chemdraw_tool/ui/generate_test_payloads.py",
]

[tool.hatch.build.targets.sdist]
# assets/ sind reine README-Medien (GIFs!) — im Paket nur Ballast.
exclude = ["chemdraw_tool/ui/node_modules", "assets"]

[tool.pytest.ini_options]
# "scripts" mit drin, damit dortige test_*.py automatisch vom Gate erfasst werden;
# die gen_*-Helfer selbst bleiben unberührt.
testpaths = ["tests", "scripts"]

[dependency-groups]
dev = [
    # EXAKT dieselbe Version wie chemdraw_tool/ui/package.json — nicht lockern.
    # Beide Playwright-Pakete (Python + JS) benutzen denselben Browser-Cache
    # (~/Library/Caches/ms-playwright) und laden je Version eine ANDERE
    # Build-Revision (z.B. chromium_headless_shell-1223 vs. -1228). Driftete das
    # ">=" auf eine neuere Version, lagen zwei Builds im Cache und der e2e-Test
    # startete gegen einen, den `npx playwright install` nie geholt hatte —
    # Gate falsch-rot mit Playwright-Stacktrace (Vorfall 14.08.2026).
    # Der Python-Playwright wird ausschließlich vom Hilfsskript
    # tests/screenshot_ui.py benutzt (kein Test, nicht im Gate); ihn ganz zu
    # entfernen wäre die Alternative — dafür müsste screenshot_ui.py aber sauber
    # degradieren, und ein Pin kostet nichts. Version hier ändern ⇒ package.json
    # mitziehen.
    "playwright==1.60.0",
    "pytest",
    "ruff>=0.15.16",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Sanfter Start: Pyflakes (F) + pycodestyle (E) + Import-Sortierung (I).
# Aggressive Auto-Fixes (z.B. unused-import-Entfernung) bewusst NICHT automatisch,
# weil RDKit-Imports teils nur wegen Seiteneffekten existieren.
select = ["E", "F", "I"]
ignore = ["E501"]  # Zeilenlänge nicht erzwingen
