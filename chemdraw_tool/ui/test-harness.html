<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Chem-MCP UI — Test Harness</title>
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: system-ui; margin: 0; padding: 16px; }
    .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .controls button {
      padding: 6px 14px; border-radius: 6px; border: 1px solid #30363d;
      background: #161b22; color: #e6edf3; cursor: pointer; font-size: 13px;
    }
    .controls button:hover { background: #262c36; }
    .controls button.active { border-color: #58a6ff; color: #58a6ff; }
    #app-frame { width: 100%; max-width: 640px; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
  </style>
</head>
<body>
  <h3 style="margin:0 0 12px; font-size:14px; color:#8b949e;">Chem-MCP UI — Test Harness</h3>
  <div class="controls">
    <button onclick="loadPayload('molecule')" id="btn-molecule">Molecule (Aspirin)</button>
    <button onclick="loadPayload('reaction')" id="btn-reaction">Reaction</button>
    <button onclick="loadPayload('database')" id="btn-database">Database</button>
    <button onclick="loadPayload('batch')" id="btn-batch">Batch (3 Mol)</button>
  </div>
  <div id="app-frame">
    <iframe id="ui" src="dist/index.html" style="width:100%; height:600px; border:none; background:#0d1117;"></iframe>
  </div>

  <script>
    // Generate test payloads (to be replaced with real backend data via the Python script)
    let TEST_PAYLOADS = {};

    fetch('test-payloads.json')
      .then(r => r.json())
      .then(data => { TEST_PAYLOADS = data; })
      .catch(() => {
        console.warn('test-payloads.json not found — run: uv run python generate_test_payloads.py');
      });

    function loadPayload(type) {
      const payload = TEST_PAYLOADS[type];
      if (!payload) {
        alert('Payload nicht geladen. Erst generieren:\n\nuv run python chemdraw_tool/ui/generate_test_payloads.py');
        return;
      }
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + type).classList.add('active');

      const iframe = document.getElementById('ui');
      iframe.contentWindow.postMessage({
        jsonrpc: '2.0',
        method: 'ontoolresult',
        params: { structuredContent: payload }
      }, '*');
    }
  </script>
</body>
</html>
