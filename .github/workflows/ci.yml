name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Untergrenze und Entwicklerversion. Python 3.13 dedentiert Docstrings beim
    # Kompilieren, 3.11/3.12 nicht — das Gate war einen Monat lokal gruen und
    # auf dem 3.12-System-Python des Runners rot (Tool-Beschreibungen ueber 2 KB).
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    name: test (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Alle Actions auf Commit-SHA gepinnt (Tag dahinter); Dependabot hebt sie an.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Install frontend dependencies
        run: npm --prefix chempane/ui ci

      - name: Install Playwright Chromium
        working-directory: chempane/ui
        run: npx playwright install --with-deps chromium

      - name: Require the reviewed Linux reference image
        run: test -s chempane/ui/src/utils/__fixtures__/aspirin.expected.linux.png

      - name: Run the gate (backend + frontend)
        run: ./test.sh
