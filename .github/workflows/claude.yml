name: Claude

# Claude im Repo ansprechen: `@claude …` in einem Issue, PR-Kommentar oder Review.
# Öffentliches Repo, deshalb eng: nur der Eigentümer löst aus (zusätzlich zur Prüfung der Action auf
# Schreibrecht), kein automatisches Review fremder Pull Requests — fremder Text soll Claude keine
# Anweisungen unterschieben und kein Guthaben verbrauchen. Review auf Wunsch: `@claude review` im PR.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Claude darf CI-Ergebnisse eines PR lesen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Pull Requests aus fremden Forks nie mit Claude bearbeiten, auch nicht auf Zuruf des Eigentümers:
      # die Action arbeitet im PR-Stand, und der Sitzungsstart-Hook dieses Repos (.claude/settings.json)
      # startet ein Skript aus dem Arbeitsbaum — bei einem fremden PR wäre das fremder Code neben dem
      # Zugangsschlüssel (docs/security.md der Action, „Which files come from the base branch“).
      - name: Herkunft des Pull Requests prüfen
        id: herkunft
        env:
          GH_TOKEN: ${{ github.token }}
          NR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        run: |
          fremd=false
          if [ -n "$NR" ]; then
            fremd=$(gh pr view "$NR" --repo "${{ github.repository }}" --json isCrossRepository --jq .isCrossRepository)
          fi
          echo "fremd=$fremd" >> "$GITHUB_OUTPUT"
          if [ "$fremd" != false ]; then echo "::notice::Pull Request aus einem Fork — Claude läuft hier nicht."; fi

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        if: steps.herkunft.outputs.fremd == 'false'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
