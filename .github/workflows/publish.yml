name: Publish to PyPI

# Trusted Publishing (OIDC) — no API token stored anywhere.
# One-time setup on pypi.org: Account → Publishing → Add pending publisher
#   PyPI project name: chemdraw-mcp
#   Owner: jurimaxam-dotcom   Repository: chemdraw-mcp
#   Workflow name: publish.yml   Environment: (leave empty)
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Das Bundle ist ein Starter (mcpb/server/run.sh holt die PyPI-Version per uv),
  # deshalb reicht ein Job ohne Python-Toolchain. Haengt am Release-Tag.
  # Erst nach PyPI: run.sh holt beim ersten Start genau diese Version per uv —
  # ein frueher hochgeladenes Bundle wuerde sonst ins Leere greifen (Codex-Befund).
  bundle:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: ./scripts/build-mcpb.sh
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/*.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Registry-Eintrag ist ein Snapshot: nur ein Publish-Lauf aendert ihn. OIDC statt
  # Device-Flow, damit er am Release haengt statt an jemandes Erinnerung
  # (docs/registry-publish.md). Reihenfolge Pflicht: erst PyPI, dann Registry.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for PyPI
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null "https://pypi.org/pypi/chemdraw-mcp/$VERSION/json"; then
              echo "chemdraw-mcp $VERSION ist auf PyPI"; exit 0
            fi
            sleep 10
          done
          echo "::error::chemdraw-mcp $VERSION nach 5 min nicht auf PyPI"; exit 1

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to MCP registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Verify the entry is live
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          LATEST=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=jurimaxam" \
            | python3 -c "import json,sys;print(next((s['server']['version'] for s in json.load(sys.stdin)['servers'] if s['_meta']['io.modelcontextprotocol.registry/official']['isLatest']), 'keine'))")
          [ "$LATEST" = "$VERSION" ] || { echo "::error::Registry meldet $LATEST statt $VERSION"; exit 1; }
          echo "Registry liefert $LATEST aus"
