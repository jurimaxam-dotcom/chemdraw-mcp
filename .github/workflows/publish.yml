name: Publish to PyPI

# Trusted Publishing (OIDC) — no API token stored anywhere.
# One-time setup on pypi.org: Account → Publishing → Add (pending) publisher, je Projekt
#   PyPI project names: chempane (neu, Pending Publisher) und chemdraw-mcp (Hülle, besteht)
#   Owner: jurimaxam-dotcom   Repository: chemdraw-mcp
#   Workflow name: publish.yml   Environment: pypi
# Nach dem Umzug nach chempane/chempane braucht jedes der beiden Projekte einen
# zusätzlichen Publisher auf das neue Repo (Umbenennung, Etappe 0, Befund 4).
# Der publish-Job laeuft im GitHub-Environment "pypi" (legt GitHub beim ersten
# Lauf selbst an). Solange der Publisher auf PyPI kein Environment nennt, nimmt
# PyPI jedes an — erst mit "pypi" dort und einem Required Reviewer in
# Settings → Environments wird daraus eine Sperre (Sicherheitsscan B2/F1).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Vorab-Pruefung (06.11.2026): Doku und CHANGELOG passen zum Code, bevor
  # etwas auf PyPI landet. Rot hier = kein Build, kein Upload. Was sich nicht
  # mechanisch pruefen laesst, steht als Checkliste in docs/registry-publish.md.
  check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require successful main CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          conclusion=$(gh run list --workflow ci.yml --event push --branch main \
            --commit "$sha" --limit 1 --json conclusion --jq '.[0].conclusion // "missing"')
          if [ "$conclusion" != success ]; then
            echo "::error::CI for $sha: $conclusion"
            exit 1
          fi
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Tag ueber env statt ${{ }} in der Shell-Zeile (Sicherheitsscan B5);
      # bei workflow_dispatch leer, dann prueft das Skript den Tag nicht.
      - run: uv run python scripts/release_check.py --tag "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: uv run pytest -q tests/test_readme.py tests/test_docs_consistency.py tests/test_release_versions.py tests/test_release_check.py

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build
      # Hülle chemdraw-mcp (nur Shim + alte Befehle, hängt an chempane) im selben Release.
      - run: uv build --out-dir dist huelle/chemdraw-mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Das Bundle ist ein Starter (mcpb/server/run.sh holt die PyPI-Version per uv).
  # Haengt am Release-Tag. Erst nach PyPI: build-mcpb.sh traegt die SHA-256 der
  # PyPI-Dateien in requirements.lock ein, run.sh installiert nur mit
  # --require-hashes (Sicherheitsscan B4). uv braucht der Job fuer `uv export`.
  bundle:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: ./scripts/build-mcpb.sh
      # Tag ueber env statt ${{ }} in der Shell-Zeile (Sicherheitsscan B5)
      - run: gh release upload "$TAG" dist/*.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}

  # Registry-Eintrag ist ein Snapshot: nur ein Publish-Lauf aendert ihn. OIDC statt
  # Device-Flow, damit er am Release haengt statt an jemandes Erinnerung
  # (docs/registry-publish.md). Reihenfolge Pflicht: erst PyPI, dann Registry.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # login github-oidc darf nur io.github.<repository_owner>/* veröffentlichen
      # (Umbenennung, Etappe 0, Befund 6). Vor dem Umzug nach chempane/chempane passt der
      # Namensraum io.github.chempane nicht zum Repo: dann überspringen, nicht rot werden.
      - name: Namespace owner
        id: ns
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          name=$(python3 -c "import json;print(json.load(open('server.json'))['name'])")
          if [ "${name#"io.github.$OWNER/"}" != "$name" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$name gehört nicht zum Namensraum von $OWNER — Registry-Publish übersprungen (erst nach dem Repo-Umzug)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for PyPI
        if: steps.ns.outputs.publish == 'true'
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null "https://pypi.org/pypi/chempane/$VERSION/json"; then
              echo "chempane $VERSION ist auf PyPI"; exit 0
            fi
            sleep 10
          done
          echo "::error::chempane $VERSION nach 5 min nicht auf PyPI"; exit 1

      # Feste Version + Pruefsumme statt "latest": das Binary laeuft mit dem
      # OIDC-Token (Sicherheitsscan B3/F1). Beim Anheben beide Werte aus
      # registry_<version>_checksums.txt des Releases uebernehmen.
      - name: Install mcp-publisher
        if: steps.ns.outputs.publish == 'true'
        env:
          MCP_PUBLISHER_VERSION: v1.8.6
          MCP_PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to MCP registry
        if: steps.ns.outputs.publish == 'true'
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Verify the entry is live
        if: steps.ns.outputs.publish == 'true'
        run: |
          set -o pipefail
          name=$(jq -r .name server.json)
          version=$(jq -r .version server.json)
          encoded=$(jq -nr --arg name "$name" '$name | @uri')
          curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers/$encoded/versions/latest" \
            | jq -es --arg name "$name" --arg version "$version" \
              'length == 1 and .[0].server.name == $name and .[0].server.version == $version'
