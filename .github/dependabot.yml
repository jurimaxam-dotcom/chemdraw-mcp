version: 2
updates:
  # SHA-Pins in .github/workflows altern sonst still (Sicherheitsscan B2).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Ein Actions-PR pro Woche statt einer pro Action.
    groups:
      actions:
        patterns: ["*"]

  # uv.lock: das Bundle installiert genau diesen Stand (requirements.lock, B4).
  # Sicherheitsupdates einer Abhaengigkeit erreichen Nutzer nur ueber ein neues
  # Release — dieser PR ist der Anlass dafuer.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # Playwright ist doppelt gepinnt (pyproject.toml und ui/package.json, exakt
    # gleich, tests/test_dependency_pins.py). Dependabot hebt nur die Python-Seite,
    # und PyPI und npm zaehlen verschieden: 1.65.2 gibt es nur auf PyPI, und bei
    # 1.65.1 laden beide Seiten verschiedene Chromium-Builds (gemessen 21.11.2026).
    # Der Pin wird deshalb von Hand auf beiden Seiten gehoben.
    ignore:
      - dependency-name: playwright
