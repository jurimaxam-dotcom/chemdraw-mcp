version: 2
updates:
  # SHA-Pins in .github/workflows altern sonst still (Sicherheitsscan B2).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Ein Actions-PR pro Woche statt einer pro Action.
    groups:
      actions:
        patterns: ["*"]

  # uv.lock: das Bundle installiert genau diesen Stand (requirements.lock, B4).
  # Sicherheitsupdates einer Abhaengigkeit erreichen Nutzer nur ueber ein neues
  # Release — dieser PR ist der Anlass dafuer.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
