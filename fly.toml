# Fly.io-Konfiguration für den Remote-Konnektor (chempane.remote), https://mcp.chempane.com/mcp.
# Deploy: `fly deploy --ha=false` (eine Maschine, Frankfurt).
app = "chempane"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  CHEMPANE_REMOTE_ALLOWED_HOSTS = "mcp.chempane.com,chempane.fly.dev"
  CHEMPANE_REMOTE_TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
